<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Abuseeyda - Home</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }


    body {
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #111111,
        #2b0000,
        #8b0000
      );
      color: white;
    }


    /* NAVBAR */

    .navbar {
      width: 100%;
      padding: 18px 7%;

      background: rgba(0, 0, 0, 0.85);

      display: flex;
      justify-content: space-between;
      align-items: center;

      position: sticky;
      top: 0;
      z-index: 100;
    }


    .brand {
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 1px;
    }


    .menu {
      display: flex;
      gap: 22px;
    }


    .menu a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }


    .menu a:hover {
      color: #ff5555;
    }
