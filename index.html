<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Abuseeyda</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #111, #8b0000);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 50%;
      background: #8b0000;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #8b0000;
      margin-top: 15px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #8b0000;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #8b0000;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .register {
      text-align: center;
      margin-top: 20px;
    }

    .register a {
      color: #8b0000;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">A</div>

    <h1>Welcome Abuseeyda</h1>

    <p class="subtitle">Login to your account</p>

    <form onsubmit="login(event)">

      <label>Email</label>
      <input type="email"
             placeholder="Enter your email"
             required>

      <label>Password</label>
      <input type="password"
             placeholder="Enter your password"
             required>

      <button type="submit">Login</button>

    </form>

    <div class="register">
      Don't have an account?
      <a href="register.html">Register</a>
    </div>

  </div>

  <script>
    function login(event) {
      event.preventDefault();
      window.location.href = "home.html";
    }
  </script>

</body>
    </html>
